# RealEstork — Muaban-specific Scoring
# Strategy: Focus on profile transparency (avatar, total listings) and name patterns.
#
# Tuning history:
#   - v1: muaban-specific signals (multi/few_active, avatar_blank, name_is_phone)
#   - v2 (session 12 / 2026-04-28): hạ thresholds 65→60 / 40→38, thêm
#     alert_filters block (wife_min_score 50), bỏ listing_is_vip penalty
#     (mọi muaban đều VIP, signal không discriminate), giảm
#     same_session_multi_listing -20 → -15.
#     Lý do: 18 cycles × ~50 listings/ngày → 0 alert. Trần điểm thực tế = 60.
#     wife_min_score thiếu trong file v1 → fall back default 55, max muaban
#     đạt sau penalty thường chỉ 30-50 → không alert.
#   - v3 (session 24 / 2026-09-08): gỡ 2 signal đọc "số tin đăng người bán" —
#     muaban không công bố số đó nên chúng chỉ fire nhờ giá trị mặc định 999 và
#     trừ 40 điểm cho MỌI tin. Đây mới là nguyên nhân thật của "0 alert", v2 chỉ
#     chữa triệu chứng bằng cách hạ ngưỡng. Bỏ luôn signal dựa SĐT (muaban che số
#     từ 21/08). wife_min_score trả về 55 cho đồng bộ với nhatot + batdongsan.

version: 3
base_score: 50
threshold_chinh_chu: 60         # nới 65 → 60 (thiếu 3 nhatot-only positive signals)
threshold_can_xac_minh: 38      # nới 40 → 38

alert_filters:
  wife_max_listing_age_hours: 24
  wife_min_score: 55             # Đồng bộ 1 mốc cho cả 3 sàn rao vặt (2026-09-08).
                                 # Mốc 50 cũ được hạ xuống để bù cho -40 điểm oan;
                                 # gỡ được nguyên nhân rồi thì không cần nới nữa.
  wife_min_price_vnd: 15000000   # giữ theo URL muaban (?price=15000000-)
  product_min_score: 60
  wife_allowed_districts:
    - "Quận 1"
    - "Quận 2"
    - "Quận 3"
    - "Quận 4"
    - "Quận 5"
    - "Quận 6"
    - "Quận 7"
    - "Quận 8"
    - "Quận 9"
    - "Quận 10"
    - "Quận 11"
    - "Quận 12"
    - "Bình Thạnh"
    - "Phú Nhuận"
    - "Tân Bình"
    - "Tân Phú"
    - "Bình Tân"
    - "Thủ Đức"
    - "Gò Vấp"

  # Per-district min price override — 3 quận xa hơn chỉ alert tin >= 40M
  district_price_overrides:
    "Quận 12": 40000000
    "Tân Phú": 40000000
    "Bình Tân": 40000000

signals:
  # Overrides for default signals
  account_type_personal:
    weight: 0    # is_company=false is unreliable on Muaban

  text_owner_language:
    weight: +5   # Đồng bộ các sàn (2026-10-26). Trước là −5 "môi giới hay giả
                 # danh" — user chốt chấm một quy cách chung cho mọi sàn.

  # muaban_multi_active_listings (-40) / muaban_few_active_listings (+20): XOÁ
  # (2026-09-08). Cả hai đọc "số tin đăng của người bán" — muaban.net không công
  # bố con số này ở bất kỳ đâu (dữ liệu trang danh sách, trang chi tiết, 3 dạng
  # URL trang cá nhân đều 404, không có API). Vì không có số, chúng chỉ fire nhờ
  # giá trị mặc định 999 → trừ 40 điểm cho 100% tin muaban → trần điểm 8 ngày đo
  # được là 40 trong khi ngưỡng gửi là 50 → 252 cycle liên tiếp, 1028 tin mới,
  # 0 alert. Thang chung poster_* không khai ở đây vì muaban không có dữ liệu nạp;
  # việc lọc môi giới dựa vào chốt chặn same_session (đang loại đúng 93% tin)
  # cộng nhóm signal nội dung bên dưới.

  avatar_is_blank:
    weight: +15  # Blank avatar = typical owner

  account_name_is_phone:
    weight: +20  # Name is phone number = strong owner signal

  # listing_is_vip: bỏ — muaban gần như mọi tin VIP, signal không discriminate

  # ── Tuổi tin & việc đẩy tin ─────────────────────────────────────────
  # Đo 2 đêm 17-19/09, theo dõi cùng 140 tin qua nửa đêm: muaban gán lại dấu
  # thời gian cho gần như toàn bộ tin trong khung 00:00-00:06 (161/164 tin bị
  # đổi dấu nằm trong khung này). Nên "tuổi tin" của muaban phần lớn là con số
  # do máy sinh, không nói gì về tin.
  #
  # Spider giờ đặt tuổi = None cho tin mang dấu máy gán → hai signal dưới đây
  # CHỈ fire với tin có dấu giờ ban ngày, tức có người thật vừa đẩy. Trước đây
  # chúng fire cho mọi tin: đo 16/09 thì 13/16 tin gửi đi có điểm đúng bằng
  # ngưỡng 55, tức qua được chủ yếu nhờ +10 chấm trên dữ liệu máy sinh.
  manually_bumped:
    weight: +10   # Có người bấm đẩy NGOÀI lượt quét nửa đêm của sàn.
                  # Quyết định của user 22/09: coi đây là tín hiệu tốt — chủ
                  # lấy lại được mặt bằng thì đẩy tin cũ lên tìm khách mới.
                  # RỦI RO ĐÃ BIẾT, chưa có dữ liệu bác bỏ: môi giới cũng đẩy
                  # tay và đẩy siêng hơn. Đối chiếu phiếu 👍/👎 rồi chỉnh lại.

  listing_very_fresh:
    weight: +10   # <= 2h: instant priority

  listing_fresh:
    weight: +5    # 2h < age <= 24h: standard fresh

  listing_stale:
    weight: -15   # > 7 ngày (phòng trường hợp VIP pin lâu)

  # trangtrang_spam_penalty: TẮT (2026-09-08) — dựa vào SĐT, mà muaban đã che số
  # từ 21/08 (0/1559 tin có số trong 18 ngày sau đó). Không còn cơ hội fire.
  trangtrang_spam_penalty:
    weight: 0

  # Other default signals to keep
  account_name_broker_keywords:
    weight: -30

  same_session_multi_listing:
    weight: -15   # giảm -20 → -15: muaban có chủ 2-3 mặt bằng phổ biến

  description_no_diacritics:
    weight: +15

  text_marketing_superlatives:
    weight: -20

  # ── Đồng bộ quy cách chấm nội dung với nhatot/batdongsan (2026-10-26) ──
  # Đo 7 ngày (867 tin muaban): emoji ≥5 fire 285 tin, mô tả >500 ký tự 169,
  # ngôn ngữ môi giới 19, hoa hồng 5. Trong 52 tin đã gửi điểm ≥55 thì 7 tin
  # sẽ tụt dưới ngưỡng — chủ yếu do emoji + mô tả dài.
  description_many_emojis:
    weight: -15

  text_commission_mention:
    weight: -15

  text_agent_language:
    weight: -10

  description_too_short:
    weight: +5

  description_too_long:
    weight: -5

  # CỐ Ý KHÔNG khai, dù sàn khác có:
  #   photo_count_low/high — trang danh sách muaban chỉ trả vài ảnh bìa: 867/867
  #     tin ≤5 ảnh → +5 cho mọi tin, không phân biệt được gì.
  #   floor_* — spider muaban không đọc tầng → floor_ambiguous +3 cho mọi tin.
  #   posted_outside_business_hours — giờ trên muaban là giờ ĐẨY tin, không phải
  #     giờ đăng; đẩy tay đã được thưởng ở manually_bumped.
