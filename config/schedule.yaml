# RealEstork — Schedule Configuration

schedules:
  nhatot_cycle:
    interval_minutes: 5          # Run every 5 minutes (nhatot API, no browser)
    function: run_nhatot_cycle
    enabled: true

  muaban_cycle:
    interval_minutes: 20         # Heavy volume, requires more time to crawl
    function: run_muaban_cycle
    enabled: true

  batdongsan_cycle:
    interval_minutes: 20         # 2-stage fetch (list → detail → lazy guru profile)
    function: run_batdongsan_cycle
    enabled: true

  facebook_groups_cycle:
    interval_minutes: 3          # Drain ingest queue (cheap; no-op khi spider disabled)
    function: run_facebook_groups_cycle
    enabled: true

  daily_digest:
    cron: "0 8 * * *"            # 8:00 AM daily
    function: daily_digest
    enabled: true

  weekly_analysis:
    cron: "0 9 * * 1"            # Monday 9:00 AM
    function: weekly_model_comparison
    enabled: true

  phone_db_cleanup:
    cron: "0 2 * * *"            # 2:00 AM daily — purge stale phone data
    function: cleanup_old_phone_data
    enabled: true

  feedback_analysis:
    cron: "0 20 * * *"           # 8:00 PM daily — analyze vợ's /mark feedback
    function: analyze_classification_feedback
    enabled: true

  check_write_health:
    interval_minutes: 5          # Bot còn sống nhưng có ghi được gì không?
    function: check_write_health # Sự cố 26-27/08: 16,5h ghi hỏng mà không ai biết.
    enabled: true

  # Nút 👍/👎 KHÔNG còn chạy theo lịch. Telegram chỉ nhận trả lời cho một lần
  # bấm trong ~15 giây, mà lịch 1 phút/lần nghĩa là cú bấm nằm chờ trung bình
  # ~30 giây — quá hạn 100% số lần (đo trên log: 09/08 5/5, 09/11 5/5, 15/09
  # 1/1). Giờ chạy bằng vòng nghe thường trực (long polling) khởi động cùng
  # bot, xem orchestrator/agent.py → run_feedback_listener.

  check_source_silence:
    interval_minutes: 10         # Nguồn nào im lặng quá lâu thì kêu.
    function: check_source_silence  # Bắt ca nhatot treo 8h (14/09) mà không ai biết.
    enabled: true
